<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta - Ponto do Cidadão</title>

    <!-- CSS customizado -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/criarconta.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/flash-mensage.css') }}"
    />
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

  <body>
    <div class="container">
      <h1>Criar Conta</h1>

      <div id="flash-container"></div>

      {% with messages = get_flashed_messages(with_categories=True) %} {% if
      messages %} {% for category, message in messages %}
      <div class="flash-message {{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <!-- Corrigido o endpoint aqui -->
      <form action="{{ url_for('main.criarconta') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required />
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <div class="links">
        Já tem uma conta?
        <a href="{{ url_for('main.login') }}">Acesse sua conta</a>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/flash-mensage.js')}}"></script>
  </body>
</html>
